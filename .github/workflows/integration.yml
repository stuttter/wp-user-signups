name: WordPress integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: WordPress 6.4 / PHP 7.4 / single-site
            wordpress: '6.4'
            php: '7.4'
            multisite: false
          - label: WordPress 7.1 / PHP 8.4 / single-site
            wordpress: '7.1'
            php: '8.4'
            multisite: false
          - label: WordPress 7.1 / PHP 8.4 / multisite
            wordpress: '7.1'
            php: '8.4'
            multisite: true
    services:
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli:2.12.0

      - name: Install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          MULTISITE: ${{ matrix.multisite }}
        shell: bash
        run: |
          wordpress_root="${RUNNER_TEMP}/wordpress"
          wp core download --version="${WP_VERSION}" --path="${wordpress_root}"
          wp config create \
            --path="${wordpress_root}" \
            --dbname=wordpress_tests \
            --dbuser=wordpress \
            --dbpass=wordpress \
            --dbhost=127.0.0.1:3306 \
            --skip-check

          if [[ "${MULTISITE}" == 'true' ]]; then
            wp core multisite-install \
              --path="${wordpress_root}" \
              --url=https://example.test \
              --title='WP User Signups tests' \
              --admin_user=admin \
              --admin_password=password \
              --admin_email=admin@example.test \
              --skip-email
          else
            wp core install \
              --path="${wordpress_root}" \
              --url=https://example.test \
              --title='WP User Signups tests' \
              --admin_user=admin \
              --admin_password=password \
              --admin_email=admin@example.test \
              --skip-email
          fi

          ln -s "${GITHUB_WORKSPACE}" "${wordpress_root}/wp-content/plugins/wp-user-signups"

          if [[ "${MULTISITE}" == 'true' ]]; then
            wp plugin activate wp-user-signups --network --path="${wordpress_root}"
          else
            wp plugin activate wp-user-signups --path="${wordpress_root}"
          fi

          wp eval-file "${GITHUB_WORKSPACE}/tests/integration/SignupSmoke.php" --path="${wordpress_root}"
